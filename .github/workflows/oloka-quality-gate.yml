name: Oloka quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/security-seo-news-automation-20261009]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run tests/automation/news-quality-gate.test.ts
      - run: pnpm run lint
